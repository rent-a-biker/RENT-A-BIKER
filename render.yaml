# Rent a Biker — Render Blueprint (M8 deployment prep, no spend yet).
#
# This file is the repo root's render.yaml. Deploy path (Kenneth's call only):
#   1. Push the contents of this directory (render.yaml, requirements.txt,
#      app/, tests/, README.md) as the root of a GitHub repo.
#   2. Render dashboard → New → Blueprint → pick the repo.
#   3. Fill in RAB_ADMIN_EMAIL / RAB_ADMIN_PASSWORD when prompted.
#   4. Review the ~$13/mo bill (web + Postgres) and approve.
# Nothing in this file spends money, creates accounts, or goes live —
# it only describes what Render should build when Kenneth says go.
#
# Blueprint reference: https://render.com/docs/blueprint-spec
# (field names verified against the current spec, Oct 2026: `runtime`
# replaces the deprecated `env`; plans use the new 0.5c-512mb-style IDs.)


services:
  - type: web
    name: rent-a-biker
    runtime: python
    # Kenneth's pick: ~$7/mo web tier (0.5 CPU, 512 MB RAM).
    plan: 0.5c-512mb
    region: virginia          # closest Render region to Florida
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health  # Render restarts the service if this fails
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # Render wires the Postgres connection string in automatically.
      - key: RAB_DATABASE_URL
        fromDatabase:
          name: rent-a-biker-db
          property: connectionString
      # JWT signing secret — auto-generated, never hard-coded. A redeploy
      # keeps the stored value, so logins survive restarts.
      - key: RAB_SECRET_KEY
        generateValue: true
      # Bike photos live on the persistent disk below (Render's filesystem is
      # otherwise wiped on every deploy).
      - key: RAB_UPLOAD_DIR
        value: /opt/render/project/src/uploads
      # Kenneth's admin login — he fills these in on the dashboard; the app
      # seeds the admin account from them at first startup.
      - key: RAB_ADMIN_EMAIL
        sync: false
      - key: RAB_ADMIN_PASSWORD
        sync: false
    # Persistent disk so uploaded bike photos survive redeploys.
    disk:
      name: rent-a-biker-uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1


databases:
  - name: rent-a-biker-db
    databaseName: rentabiker
    # Kenneth's pick: ~$6/mo Postgres tier.
    plan: 0.1c-256mb
    region: virginia
    # Empty allow-list = reachable only over Render's private network.
    ipAllowList: []
